<script id="alexihub-mobile-runtime">
(function () {
  if (window.__ahMobileRuntimeReady) return;
  window.__ahMobileRuntimeReady = true;

  const mobileQuery = window.matchMedia('(max-width: 820px)');
  const body = document.body;
  if (!body) return;

  function detectPage() {
    if (document.querySelector('.settings-app > .settings-sidebar')) return 'server-settings';
    if (document.getElementById('home-app')) return 'home';
    if (document.querySelector('main.chat-main')) return 'server-channel';
    if (body.dataset.activeDmAccountId && document.querySelector('.dm-sidebar')) return 'dm';
    if (document.querySelector('main.content') && document.querySelector('.side')) return 'travel';
    if (document.querySelector('.server-sidebar') && document.querySelector('main.main')) return 'server-home';
    return '';
  }

  const page = detectPage();
  if (!page) return;
  body.classList.add('ah-mobile-ready', 'ah-mobile-' + page);

  function translatedLabel(key, fallback) {
    try {
      const value = window.AlexiHubI18n?.t?.(key);
      return value && value !== key ? value : fallback;
    } catch (_) {
      return fallback;
    }
  }

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'ah-mobile-nav-toggle';
  toggle.setAttribute('aria-expanded', 'false');
  toggle.setAttribute('aria-label', translatedLabel('common.aria.home_navigation', 'Open navigation'));
  toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

  const scrim = document.createElement('button');
  scrim.type = 'button';
  scrim.className = 'ah-mobile-scrim';
  scrim.setAttribute('aria-label', translatedLabel('common.actions.close', 'Close navigation'));

  body.append(toggle, scrim);

  const drawerSelectors = page === 'server-settings'
    ? ['.settings-sidebar']
    : page === 'travel'
      ? ['.server-rail', '.side']
      : page === 'home' || page === 'dm'
        ? ['.server-rail', '.dm-sidebar']
        : ['.server-rail', '.server-sidebar'];

  function drawers() {
    return drawerSelectors.map(selector => document.querySelector(selector)).filter(Boolean);
  }

  function syncDrawerAria(open) {
    drawers().forEach(drawer => drawer.setAttribute('aria-hidden', mobileQuery.matches && !open ? 'true' : 'false'));
  }

  function setNavigation(open, options) {
    const shouldOpen = Boolean(open && mobileQuery.matches);
    body.classList.toggle('ah-mobile-nav-open', shouldOpen);
    toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
    toggle.setAttribute('aria-label', shouldOpen
      ? translatedLabel('common.actions.close', 'Close navigation')
      : translatedLabel('common.aria.home_navigation', 'Open navigation'));
    syncDrawerAria(shouldOpen);
    if (shouldOpen && options?.focus !== false) {
      const active = drawers().flatMap(drawer => Array.from(drawer.querySelectorAll('.active, [aria-current="page"]')))[0];
      if (active && typeof active.focus === 'function') requestAnimationFrame(() => active.focus({preventScroll: true}));
    }
  }

  toggle.addEventListener('click', () => setNavigation(!body.classList.contains('ah-mobile-nav-open'), {focus: false}));
  scrim.addEventListener('click', () => setNavigation(false));

  document.addEventListener('click', event => {
    if (!mobileQuery.matches || !body.classList.contains('ah-mobile-nav-open')) return;
    const target = event.target;
    if (!(target instanceof Element)) return;
    const selected = target.closest('.dm-row, .nav-item, [data-home-view], .chan-link, .side-link');
    if (!selected) return;

    if (page === 'server-home' && selected.matches('a, a *')) {
      const anchor = selected.closest('a');
      try {
        if (anchor && new URL(anchor.href, location.href).pathname === location.pathname) {
          sessionStorage.setItem('ah-mobile-server-home-content', '1');
        }
      } catch (_) {}
    }
    setNavigation(false);
  }, true);

  function setupEmbeddedSettings() {
    document.querySelectorAll('.ah-settings-shell').forEach(shell => {
      if (shell.dataset.ahMobileReady === '1') return;
      const top = shell.querySelector('.ah-settings-top');
      const sidebar = shell.querySelector(':scope > .ah-settings-sidebar');
      if (!top || !sidebar) return;
      shell.dataset.ahMobileReady = '1';

      const settingsToggle = document.createElement('button');
      settingsToggle.type = 'button';
      settingsToggle.className = 'ah-mobile-settings-toggle';
      settingsToggle.setAttribute('aria-label', translatedLabel('common.aria.home_navigation', 'Open settings navigation'));
      settingsToggle.setAttribute('aria-expanded', 'false');
      settingsToggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

      const settingsScrim = document.createElement('button');
      settingsScrim.type = 'button';
      settingsScrim.className = 'ah-mobile-settings-scrim';
      settingsScrim.setAttribute('aria-label', translatedLabel('common.actions.close', 'Close settings navigation'));

      top.prepend(settingsToggle);
      shell.append(settingsScrim);

      const setSettingsNavigation = open => {
        const shouldOpen = Boolean(open && mobileQuery.matches);
        shell.classList.toggle('ah-mobile-settings-nav-open', shouldOpen);
        settingsToggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
        sidebar.setAttribute('aria-hidden', mobileQuery.matches && !shouldOpen ? 'true' : 'false');
      };

      settingsToggle.addEventListener('click', () => setSettingsNavigation(!shell.classList.contains('ah-mobile-settings-nav-open')));
      settingsScrim.addEventListener('click', () => setSettingsNavigation(false));
      sidebar.addEventListener('click', event => {
        if (!(event.target instanceof Element)) return;
        if (event.target.closest('.ah-settings-nav')) setSettingsNavigation(false);
      });
      shell.__ahSetMobileSettingsNavigation = setSettingsNavigation;
      setSettingsNavigation(false);
    });
  }

  setupEmbeddedSettings();
  const settingsObserver = new MutationObserver(setupEmbeddedSettings);
  settingsObserver.observe(body, {childList: true, subtree: true});

  function openSettingsShell() {
    return Array.from(document.querySelectorAll('.ah-settings-shell')).find(shell => (
      shell.closest('.ah-settings-backdrop.open, .ah-settings-backdrop[style*="display: flex"], .ah-settings-backdrop[style*="display:flex"]')
    ));
  }

  const gestureIgnoreSelector = [
    'input', 'textarea', 'select', '[contenteditable="true"]',
    '.modal-card', '.backdrop.open', '.ah-event-dialog', '.ah-image-editor',
    '.ah-profile-customizer-shell', '.ah-language-menu', '.ah-benefit-carousel',
    '.ah-store-tabs', '.ah-studio-nav', '.categories', '.friend-tabs',
    '[data-no-mobile-swipe]'
  ].join(',');

  let touchStart = null;
  document.addEventListener('touchstart', event => {
    if (!mobileQuery.matches || event.touches.length !== 1) return;
    const target = event.target;
    if (!(target instanceof Element)) return;
    if (!target.closest('.ah-mobile-scrim, .ah-mobile-settings-scrim') && target.closest(gestureIgnoreSelector)) return;
    const touch = event.touches[0];
    touchStart = {x: touch.clientX, y: touch.clientY, target};
  }, {passive: true});

  document.addEventListener('touchend', event => {
    if (!touchStart || !mobileQuery.matches || !event.changedTouches.length) {
      touchStart = null;
      return;
    }
    const touch = event.changedTouches[0];
    const dx = touch.clientX - touchStart.x;
    const dy = touch.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.35) return;

    const settingsShell = openSettingsShell();
    if (settingsShell?.__ahSetMobileSettingsNavigation) {
      settingsShell.__ahSetMobileSettingsNavigation(dx > 0);
      return;
    }
    setNavigation(dx > 0, {focus: false});
  }, {passive: true});

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const settingsShell = openSettingsShell();
    if (settingsShell?.classList.contains('ah-mobile-settings-nav-open')) {
      settingsShell.__ahSetMobileSettingsNavigation?.(false);
      return;
    }
    if (body.classList.contains('ah-mobile-nav-open')) setNavigation(false);
  });

  function onViewportChange() {
    if (!mobileQuery.matches) {
      setNavigation(false);
      drawers().forEach(drawer => drawer.setAttribute('aria-hidden', 'false'));
      document.querySelectorAll('.ah-settings-shell').forEach(shell => shell.__ahSetMobileSettingsNavigation?.(false));
    } else {
      syncDrawerAria(body.classList.contains('ah-mobile-nav-open'));
    }
  }

  mobileQuery.addEventListener?.('change', onViewportChange);
  window.addEventListener('orientationchange', () => requestAnimationFrame(onViewportChange), {passive: true});

  let showServerHomeContent = false;
  if (page === 'server-home') {
    try {
      showServerHomeContent = sessionStorage.getItem('ah-mobile-server-home-content') === '1';
      sessionStorage.removeItem('ah-mobile-server-home-content');
    } catch (_) {}
  }
  setNavigation(page === 'server-home' && !showServerHomeContent, {focus: false});

  window.AlexiHubMobile = {
    page,
    open: () => setNavigation(true, {focus: false}),
    close: () => setNavigation(false),
    toggle: () => setNavigation(!body.classList.contains('ah-mobile-nav-open'), {focus: false})
  };
})();
</script>
