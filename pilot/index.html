<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexiHub</title>
<link rel="stylesheet" href="assets/shell.css">
</head>
<body>

  <div class="app" id="app-root">

    <!-- ================= PERSISTENT: server rail ================= -->
    <aside class="server-rail">
      <a class="server-dot active home-dot" href="/community/dm/marichka" title="Особисті повідомлення">DM</a>
      <div class="server-sep"></div>
      <a class="server-dot" data-mention-server-id="1" href="/community/servers/1/channel/10" style="background:linear-gradient(135deg,#f5576c,#7367f0)" title="Дев-хаб">D</a>
      <a class="server-dot" data-mention-server-id="2" href="/community/servers/2/channel/20" style="background:#3a4dd1" title="Ігровий клуб">І</a>
      <a class="server-dot plus" href="#" title="Створити сервер">+</a>
    </aside>

    <!-- ================= DYNAMIC: sidebar + main + right ========== -->
    <!-- Router replaces the CHILDREN of this node on every navigation.
         The node itself (and everything outside it) never gets touched. -->
    <div id="app-dynamic"></div>

  </div>

  <!-- ================= PERSISTENT: voice message overlay dock ================= -->
  <!-- Exactly one <audio> element for the whole app. It lives here, outside
       #app-dynamic, so swapping chats can never stop it or restart it. -->
  <div id="ah-voice-dock" role="region" aria-label="Голосове повідомлення">
    <div class="ahvd-card">
      <div class="ahvd-main">
        <button type="button" class="ahvd-btn ahvd-play" title="Відтворити / пауза" aria-label="Відтворити / пауза">
          <svg class="ahvd-i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ahvd-i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="ahvd-info">
          <b class="ahvd-author"></b>
          <span class="ahvd-when"></span>
        </div>
        <span class="ahvd-time">00:00</span>
        <button type="button" class="ahvd-btn ahvd-close" title="Закрити" aria-label="Закрити">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="ahvd-bar"><div class="ahvd-fill"></div></div>
    </div>
  </div>
  <audio id="ah-shell-audio" preload="none"></audio>

  <script src="assets/router.js"></script>
</body>
</html>
