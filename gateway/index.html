<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexiHub — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --app: #06070b;
    --panel: #18191d;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --accent: #5865f2;
    --danger: #ef4444;
    --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 120% at 50% 20%, #14152b 0%, #06070b 60%);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #wake-preloader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 32px;
    text-align: center;
    animation: fadeIn .5s ease;
  }

  /* Лого — те саме місце й розмір, що й у Discord: велика іконка по центру екрана */
  .wp-logo {
    width: 84px;
    height: 84px;
    border-radius: 26px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 32px;
    color: #fff;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 14px 40px rgba(88,101,242,0.45);
    animation: logoPulse 2.4s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* Дискордівська анімація завантаження: три крапки підстрибують хвилею одна за одною */
  .wp-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 18px;
  }

  .wp-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text);
    opacity: 0.9;
    animation: dotBounce 1.1s ease-in-out infinite;
  }

  .wp-dot:nth-child(1) { animation-delay: 0s; }
  .wp-dot:nth-child(2) { animation-delay: 0.15s; }
  .wp-dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
    30% { transform: translateY(-10px); opacity: 1; }
  }

  .wp-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--text);
  }

  .wp-subtitle {
    font-size: 13px;
    color: var(--muted);
    max-width: 320px;
    line-height: 1.5;
    min-height: 36px;
    transition: opacity .25s ease;
  }

  .wp-retry {
    display: none;
    margin-top: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .wp-retry:hover { filter: brightness(1.08); }

  /* Коли сталась помилка — ховаємо крапки, показуємо кнопку "спробувати ще раз" */
  .wp-error .wp-dots { display: none; }
  .wp-error .wp-logo { animation: none; }
  .wp-error .wp-retry { display: inline-block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wp-hide { opacity: 0; pointer-events: none; transition: opacity .35s ease; }
</style>
</head>
<body>

  <div id="wake-preloader">
    <div class="wp-logo">AH</div>
    <div class="wp-dots" id="wp-dots">
      <span class="wp-dot"></span>
      <span class="wp-dot"></span>
      <span class="wp-dot"></span>
    </div>
    <div class="wp-title">AlexiHub</div>
    <div class="wp-subtitle" id="wp-status">Loading…</div>
    <button class="wp-retry" id="wp-retry-btn">Try again</button>
  </div>

  <script>
  (function () {
    // ==== НАЛАШТУВАННЯ — заміни на свої значення ====
    var APP_URL = 'https://your-app.onrender.com';      // адреса основного застосунку (Render web service)
    var PING_PATH = '/api/ping';                         // легкий health-check ендпоінт
    var SLOW_MESSAGE_AFTER_MS = 5000;                    // коли міняти текст (за ТЗ — 5с)
    var VERY_SLOW_MESSAGE_AFTER_MS = 20000;               // додаткове повідомлення для довгого холодного старту
    var RETRY_INTERVAL_MS = 3000;                         // пауза між спробами пінгу
    var REQUEST_TIMEOUT_MS = 8000;                        // таймаут однієї спроби fetch
    var MAX_TOTAL_WAIT_MS = 90000;                        // після цього — показуємо кнопку "спробувати ще раз"
    // =================================================

    var statusEl = document.getElementById('wp-status');
    var rootEl = document.getElementById('wake-preloader');
    var retryBtn = document.getElementById('wp-retry-btn');

    var startedAt = Date.now();
    var stopped = false;

    function setMessage(text) {
      statusEl.style.opacity = 0;
      setTimeout(function () {
        statusEl.textContent = text;
        statusEl.style.opacity = 1;
      }, 150);
    }

    function scheduleMessages() {
      setTimeout(function () {
        if (!stopped) setMessage('The server is waking up, hang on a little longer…');
      }, SLOW_MESSAGE_AFTER_MS);

      setTimeout(function () {
        if (!stopped) setMessage('This can take up to a minute — the container just started.');
      }, VERY_SLOW_MESSAGE_AFTER_MS);
    }

    function pingOnce() {
      var controller = new AbortController();
      var timeoutId = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);

      return fetch(APP_URL + PING_PATH, {
        method: 'GET',
        cache: 'no-store',
        signal: controller.signal
      }).then(function (res) {
        clearTimeout(timeoutId);
        return res.ok;
      }).catch(function () {
        clearTimeout(timeoutId);
        return false;
      });
    }

    function goToApp() {
      stopped = true;
      rootEl.classList.add('wp-hide');
      // зберігаємо шлях/параметри, з якими прийшов користувач
      var target = APP_URL + window.location.pathname + window.location.search;
      setTimeout(function () {
        window.location.replace(target);
      }, 250);
    }

    function showError() {
      stopped = true;
      rootEl.classList.add('wp-error');
      setMessage('Could not wake up the server. Please try again.');
    }

    function poll() {
      if (stopped) return;

      if (Date.now() - startedAt > MAX_TOTAL_WAIT_MS) {
        showError();
        return;
      }

      pingOnce().then(function (ok) {
        if (stopped) return;
        if (ok) {
          goToApp();
        } else {
          setTimeout(poll, RETRY_INTERVAL_MS);
        }
      });
    }

    retryBtn.addEventListener('click', function () {
      rootEl.classList.remove('wp-error');
      stopped = false;
      startedAt = Date.now();
      setMessage('Loading…');
      poll();
    });

    scheduleMessages();
    poll();
  })();
  </script>

</body>
</html>
